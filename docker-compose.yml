services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: change_me
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: noon
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d noon"]
      interval: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: change_me
      PGADMIN_DEFAULT_PASSWORD: change_me
    ports:
      - "8085:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    profiles: ["jobs"]
    command: ["--pg-host", "db"]
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin_data:

[project]
name = "noon-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Youssef Ayman", email = "" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "pandas>=3.0.6",
    "psycopg[binary,pool]>=3.3.6",
    "sqlalchemy>=2.1.4",
]

[project.scripts]
noon-pipeline = "noon_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
